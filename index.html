<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یه چیز برای تو 🎂</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #17152b, #49345f, #1d2945);
  color: white;
  text-align: center;
}

.box {
  width: 85%;
  max-width: 420px;
  padding: 35px 20px;
  border-radius: 25px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}

h1 {
  font-size: 28px;
}

p {
  font-size: 18px;
  line-height: 2;
}

button {
  border: none;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 18px;
  background: white;
  color: #49345f;
  cursor: pointer;
}

#message {
  display: none;
  margin-top: 25px;
}

.heart {
  font-size: 45px;
  animation: float 2s infinite;
}

@keyframes float {
  50% { transform: translateY(-10px); }
}
</style>
</head>

<body>

<div class="box">

<div class="heart">🎁</div>

<h1>یه چیزی برات دارم...</h1>

<p>قبل از اینکه بازش کنی، آماده‌ای؟ 👀</p>

<button onclick="showMessage()">بازش کن ✨</button>

<div id="message">
<h1>🎂 تولدت مبارک مهدی 🎂</h1>
<p>
امیدوارم ۲۰ مهر امسال شروع یه سال پر از اتفاقای قشنگ برات باشه.
<br>
همیشه بخندی و کلی اتفاق خوب منتظرت باشه ✨
</p>
<p>:) 🖤</p>
</div>

</div>

<script>
function showMessage() {
  document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
